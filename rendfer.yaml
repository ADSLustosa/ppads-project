services:
  - type: web
    name: tigerbank
    env: python
    region: oregon
    plan: free
    autoDeploy: true

    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn wsgi:app"

    envVars:
      - key: FLASK_ENV
        value: production

      - key: SECRET_KEY
        sync: false

      - key: DATABASE_URL
        sync: false
