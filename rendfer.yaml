services:
  - type: web
    name: tigerbank
    env: python
    region: oregon
    plan: free
    autoDeploy: true


    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt

    startCommand: gunicorn wsgi:app --workers=2 --threads=2 --timeout=120


    envVars:
      - key: FLASK_ENV
        value: production

      - key: SECRET_KEY
        sync: false

      - key: DATABASE_URL
        sync: false


      - key: SQLALCHEMY_DATABASE_URI
        fromDatabase:
          name: postgres
          property: connectionString


    databases:
      - name: postgres
