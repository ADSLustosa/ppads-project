
{% extends 'base.html' %}
{% block title %}💵 Depositar - Tiger Bank{% endblock %}
{% block header %}
<div class="profile-header">

    <!-- Ícone -->
    <img class="perfil-icon" src="{{ url_for('static', filename='img/tigre.png') }}" alt="Ícone do Tigre">

    <!-- Título -->
    <h1>Depósito</h1>

    <!-- Botão voltar no canto direito -->
    <nav>
        <a class="btn btn-secondary" href="{{ url_for('dashboard.index') }}">VOLTAR</a>
    </nav>

</div>
{% endblock %}

{% block content %}
<div class="card">
  <h2>💵 Depositar</h2>
  <form method="post">

<div class="form-group">
  <label>Valor</label>
  <div class="input-wrapper"><input type="text" name="valor" class="money-input"></div>
</div>
<div class="form-group"><label>Descrição</label><div class="input-wrapper"><input name="descricao" placeholder="Depósito em conta"></div></div>

    <button class="btn btn-success" type="submit">CONFIRMAR</button>
  </form>
</div>
{% endblock %}
