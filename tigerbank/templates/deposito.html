
{% extends 'base.html' %}
{% block title %}💵 Depositar - Tiger Bank{% endblock %}
{% block content %}
<div class="card">
  <h2>💵 Depositar</h2>
  <form method="post">
    {{ csrf_token() }}
<div class="form-group"><label>Valor</label><input type="number" step="0.01" min="0.01" name="valor" required></div>
<div class="form-group"><label>Descrição</label><input name="descricao" placeholder="Depósito em conta"></div>

    <button class="btn btn-success" type="submit">CONFIRMAR</button>
    <a class="btn btn-secondary" href="{{ url_for('dashboard.index') }}">VOLTAR</a>
  </form>
</div>
{% endblock %}
