{% extends 'base.html' %}
{% block title %}Redefinir Senha - Tiger Bank{% endblock %}

{% block header %}
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">

        <h5 class="m-0 text-white fw-semibold">Redefinir Senha</h5>

        <a href="{{ url_for('auth.login') }}" class="btn btn-light fw-semibold px-3">
            Voltar
        </a>

    </div>
</nav>
{% endblock %}

{% block content %}

<div class="row justify-content-center mt-4">
    <div class="col-md-5">

        <div class="card shadow-sm">
            <div class="card-body">

                <h4 class="fw-bold mb-3 text-center">🔑 Redefinir Senha</h4>
                <p class="text-muted text-center mb-4">
                    Informe o e-mail cadastrado e enviaremos as instruções.
                </p>

                <form method="post">

                    <div class="mb-3">
                        <label class="form-label">E-mail cadastrado</label>
                        <input 
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="seu@email.com"
                            required
                        >
                    </div>

                    <button class="btn btn-primary w-100 py-2 fw-semibold" type="submit">
                        Enviar Instruções
                    </button>

                </form>

                <div class="text-center mt-3">
                    <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-semibold">
                        ← Voltar ao Login
                    </a>
                </div>

            </div>
        </div>

    </div>
</div>

{% endblock %}
